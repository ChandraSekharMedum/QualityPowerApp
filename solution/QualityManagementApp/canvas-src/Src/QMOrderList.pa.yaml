Screens:
  QMOrderList:
    Properties:
      Fill: =RGBA(244, 246, 247, 1)
      LoadingSpinnerColor: =RGBA(13, 98, 115, 1)
    Children:
      - OL_HeaderBar:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(13, 98, 115, 1)
            FontWeight: =FontWeight.Semibold
            Height: =56
            PaddingLeft: =56
            Size: =18
            Text: ="Enter Test Results"
            Width: =Parent.Width
      - OL_BackButton:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(255, 255, 255, 1)
            BorderThickness: =1
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(13, 98, 115, 1)
            Height: =32
            OnSelect: =Navigate(QMHome, ScreenTransition.None)
            Size: =12
            Text: ="<"
            Width: =40
            X: =8
            Y: =12
      - OL_Search:
          Control: Classic/TextInput@2.3.2
          Properties:
            Default: =""
            Height: =44
            HintText: ="Search order, item or product"
            Size: =12
            Width: =Parent.Width - 32
            X: =16
            Y: =70
      - OL_FilterOpen:
          Control: Classic/CheckBox@2.1.0
          Properties:
            Height: =32
            Size: =10
            Text: ="Open only"
            Width: =140
            X: =16
            Y: =122
      - OL_Count:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =RGBA(107, 125, 132, 1)
            Height: =32
            Size: =9
            Text: =CountRows(OL_Gallery.AllItems) & " of " & CountRows('Quality Orders (cache)')
            Width: =140
            X: =Parent.Width - 156
            Y: =122
      - OL_Hint:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(107, 125, 132, 1)
            Height: =20
            Size: =8
            Text: ="Tap a row, or the order number, to enter results"
            Width: =Parent.Width - 32
            X: =16
            Y: =154
      - OL_Gallery:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Height: =Parent.Height - 194
            Items: |
              =SortByColumns(
                 Filter('Quality Orders (cache)',
                   (IsBlank(OL_Search.Text) ||
                     StartsWith(cog_qualityordernumber, OL_Search.Text) ||
                     StartsWith(cog_itemnumber, OL_Search.Text) ||
                     StartsWith(cog_productname, OL_Search.Text)) &&
                   (!OL_FilterOpen.Value || cog_status = 200000000)),
                 "cog_qualityordernumber", SortOrder.Ascending)
            OnSelect: |
              =Set(varOrder, OL_Gallery.Selected);
               Navigate(QMResultSheet, ScreenTransition.None)
            TemplatePadding: =0
            TemplateSize: =76
            Width: =Parent.Width - 32
            X: =16
            Y: =178
          Children:
            - OL_RowFill:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =75
                  OnSelect: =Select(Parent)
                  Width: =Parent.TemplateWidth
            - OL_OrderLink:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(13, 98, 115, 1)
                  FontWeight: =FontWeight.Semibold
                  Height: =24
                  OnSelect: |
                    =Set(varOrder, ThisItem);
                     Navigate(QMResultSheet, ScreenTransition.None)
                  Text: =ThisItem.cog_qualityordernumber
                  Underline: =true
                  Width: =130
                  X: =12
                  Y: =10
            - OL_Detail:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(107, 125, 132, 1)
                  Height: =20
                  OnSelect: |
                    =Set(varOrder, ThisItem);
                     Navigate(QMResultSheet, ScreenTransition.None)
                  Size: =9
                  Text: |
                    =ThisItem.cog_itemnumber & "  -  " & ThisItem.cog_productname &
                     If(IsBlank(ThisItem.cog_batchnumber), "", "  -  " & ThisItem.cog_batchnumber)
                  Width: =Parent.TemplateWidth - 130
                  X: =12
                  Y: =34
            - OL_Meta:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(107, 125, 132, 1)
                  Height: =18
                  OnSelect: |
                    =Set(varOrder, ThisItem);
                     Navigate(QMResultSheet, ScreenTransition.None)
                  Size: =8
                  Text: |
                    ="Test group " & ThisItem.cog_testgroupid &
                     "  -  site " & ThisItem.cog_siteid &
                     "  -  " & ThisItem.cog_company
                  Width: =Parent.TemplateWidth - 130
                  X: =12
                  Y: =52
            - OL_Status:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: |
                    =Switch(ThisItem.cog_status,
                        200000001, RGBA(156, 31, 23, 1),
                        200000002, RGBA(32, 97, 61, 1),
                        RGBA(138, 86, 6, 1))
                  Fill: |
                    =Switch(ThisItem.cog_status,
                        200000001, RGBA(247, 227, 225, 1),
                        200000002, RGBA(222, 238, 228, 1),
                        RGBA(248, 235, 214, 1))
                  FontWeight: =FontWeight.Semibold
                  Height: =28
                  OnSelect: |
                    =Set(varOrder, ThisItem);
                     Navigate(QMResultSheet, ScreenTransition.None)
                  Size: =9
                  Text: |
                    =Switch(ThisItem.cog_status,
                        200000000, "OPEN",
                        200000001, "FAIL",
                        200000002, "PASS", "-")
                  Width: =80
                  X: =Parent.TemplateWidth - 106
                  Y: =18
            - OL_Chevron:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =RGBA(107, 125, 132, 1)
                  Height: =28
                  OnSelect: |
                    =Set(varOrder, ThisItem);
                     Navigate(QMResultSheet, ScreenTransition.None)
                  Size: =12
                  Text: =">"
                  Width: =16
                  X: =Parent.TemplateWidth - 22
                  Y: =18
            - OL_RowRule:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(210, 220, 223, 1)
                  Height: =1
                  Width: =Parent.TemplateWidth
                  Y: =75
