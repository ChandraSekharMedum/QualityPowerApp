# ************************************************************************************************
# Quality Management -- Home
# Visual treatment A "Instrument" (D-09).
#
# Quality order creation and non-conformance creation are deferred: Phase 1 proved neither
# can be created over OData (Owner-dimension defect on the virtual entity path; the quality
# entities are not exposed to the F&O connector). Those tiles are shown but disabled so the
# intent is visible without offering a dead action.
# ************************************************************************************************
Screens:
  QMHome:
    Properties:
      Fill: =RGBA(244, 246, 247, 1)
      LoadingSpinnerColor: =RGBA(13, 98, 115, 1)
      OnVisible: |
        =Set(varQueued, CountRows(Filter(Outbox, cog_outboxstatus < 4)));
         Set(varOpenOrders, CountRows(Filter('Quality Orders (cache)', cog_status = 200000000)))
    Children:
      - HM_HeaderBar:
          Control: Label
          Properties:
            Text: ="Quality Management"
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =56
            Fill: =RGBA(13, 98, 115, 1)
            Color: =RGBA(255, 255, 255, 1)
            Size: =18
            FontWeight: =FontWeight.Semibold
            PaddingLeft: =16
            VerticalAlign: =VerticalAlign.Middle

      - HM_SyncStrip:
          Control: Label
          Properties:
            Text: |
              =If(Connection.Connected,
                  "Online  -  " & CountRows('Quality Orders (cache)') & " orders cached",
                  "Offline  -  working from cache")
            X: =0
            Y: =56
            Width: =Parent.Width
            Height: =28
            Fill: =If(Connection.Connected, RGBA(222, 238, 228, 1), RGBA(248, 235, 214, 1))
            Color: =If(Connection.Connected, RGBA(32, 97, 61, 1), RGBA(138, 86, 6, 1))
            Size: =9
            FontWeight: =FontWeight.Semibold
            PaddingLeft: =16
            VerticalAlign: =VerticalAlign.Middle

      - HM_QueueBanner:
          Control: Label
          Properties:
            Text: =varQueued & " item(s) waiting to submit  -  tap to view"
            X: =16
            Y: =96
            Width: =Parent.Width - 32
            Height: =36
            Visible: =varQueued > 0
            Fill: =RGBA(248, 235, 214, 1)
            Color: =RGBA(138, 86, 6, 1)
            Size: =10
            FontWeight: =FontWeight.Semibold
            PaddingLeft: =12
            VerticalAlign: =VerticalAlign.Middle
            OnSelect: =Navigate(QMQueue, ScreenTransition.Cover)

      - HM_Tile_Results:
          Control: Classic/Button
          Properties:
            Text: ="Enter Test Results" & Char(10) & varOpenOrders & " open"
            X: =16
            Y: =If(varQueued > 0, 144, 104)
            Width: =(Parent.Width - 44) / 2
            Height: =110
            Fill: =RGBA(255, 255, 255, 1)
            Color: =RGBA(13, 98, 115, 1)
            BorderColor: =RGBA(13, 98, 115, 1)
            BorderThickness: =2
            Size: =12
            FontWeight: =FontWeight.Semibold
            OnSelect: =Navigate(QMOrderList, ScreenTransition.None)

      - HM_Tile_Queue:
          Control: Classic/Button
          Properties:
            Text: ="Submission Queue" & Char(10) & varQueued & " pending"
            X: =Parent.Width / 2 + 6
            Y: =If(varQueued > 0, 144, 104)
            Width: =(Parent.Width - 44) / 2
            Height: =110
            Fill: =RGBA(255, 255, 255, 1)
            Color: =RGBA(13, 98, 115, 1)
            BorderColor: =RGBA(210, 220, 223, 1)
            BorderThickness: =2
            Size: =12
            FontWeight: =FontWeight.Semibold
            OnSelect: =Navigate(QMQueue, ScreenTransition.None)

      - HM_Tile_QualityOrder:
          Control: Classic/Button
          Properties:
            Text: ="Quality Order" & Char(10) & "later release"
            X: =16
            Y: =If(varQueued > 0, 266, 226)
            Width: =(Parent.Width - 44) / 2
            Height: =110
            Fill: =RGBA(233, 239, 241, 1)
            Color: =RGBA(107, 125, 132, 1)
            BorderColor: =RGBA(210, 220, 223, 1)
            BorderThickness: =1
            Size: =12
            DisplayMode: =DisplayMode.Disabled

      - HM_Tile_NC:
          Control: Classic/Button
          Properties:
            Text: ="Create NC" & Char(10) & "later release"
            X: =Parent.Width / 2 + 6
            Y: =If(varQueued > 0, 266, 226)
            Width: =(Parent.Width - 44) / 2
            Height: =110
            Fill: =RGBA(233, 239, 241, 1)
            Color: =RGBA(107, 125, 132, 1)
            BorderColor: =RGBA(210, 220, 223, 1)
            BorderThickness: =1
            Size: =12
            DisplayMode: =DisplayMode.Disabled

      - HM_DeferredNote:
          Control: Label
          Properties:
            Text: ="Quality order and non-conformance creation are planned for a later release."
            X: =16
            Y: =If(varQueued > 0, 386, 346)
            Width: =Parent.Width - 32
            Height: =32
            Size: =9
            Color: =RGBA(107, 125, 132, 1)
            VerticalAlign: =VerticalAlign.Middle

