Screens:
  QMHome:
    Properties:
      Fill: =RGBA(244, 246, 247, 1)
      LoadingSpinnerColor: =RGBA(13, 98, 115, 1)
      OnVisible: |
        =Set(varQueued, CountRows(Filter(Outbox, cog_outboxstatus < 4)));
         Set(varOpenOrders, CountRows(Filter('Quality Orders (cache)', cog_status = 200000000)))
    Children:
      - HM_HeaderBar:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(13, 98, 115, 1)
            FontWeight: =FontWeight.Semibold
            Height: =56
            PaddingLeft: =16
            Size: =18
            Text: ="Quality Management"
            Width: =Parent.Width
      - HM_SyncStrip:
          Control: Label@2.5.1
          Properties:
            Color: =If(Connection.Connected, RGBA(32, 97, 61, 1), RGBA(138, 86, 6, 1))
            Fill: =If(Connection.Connected, RGBA(222, 238, 228, 1), RGBA(248, 235, 214, 1))
            FontWeight: =FontWeight.Semibold
            Height: =28
            PaddingLeft: =16
            Size: =9
            Text: |
              =If(Connection.Connected,
                  "Online  -  " & CountRows('Quality Orders (cache)') & " orders cached",
                  "Offline  -  working from cache")
            Width: =Parent.Width
            Y: =56
      - HM_QueueBanner:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(138, 86, 6, 1)
            Fill: =RGBA(248, 235, 214, 1)
            FontWeight: =FontWeight.Semibold
            Height: =36
            OnSelect: =Navigate(QMQueue, ScreenTransition.Cover)
            PaddingLeft: =12
            Size: =10
            Text: =varQueued & " item(s) waiting to submit  -  tap to view"
            Visible: =varQueued > 0
            Width: =Parent.Width - 32
            X: =16
            Y: =96
      - HM_Tile_Results:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(13, 98, 115, 1)
            Color: =RGBA(13, 98, 115, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Height: =110
            OnSelect: =Navigate(QMOrderList, ScreenTransition.None)
            Size: =12
            Text: ="Enter Test Results" & Char(10) & varOpenOrders & " open"
            Width: =(Parent.Width - 44) / 2
            X: =16
            Y: =If(varQueued > 0, 144, 104)
      - HM_Tile_Queue:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(210, 220, 223, 1)
            Color: =RGBA(13, 98, 115, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Height: =110
            OnSelect: =Navigate(QMQueue, ScreenTransition.None)
            Size: =12
            Text: ="Submission Queue" & Char(10) & varQueued & " pending"
            Width: =(Parent.Width - 44) / 2
            X: =Parent.Width / 2 + 6
            Y: =If(varQueued > 0, 144, 104)
      - HM_Tile_QualityOrder:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(210, 220, 223, 1)
            BorderThickness: =1
            Color: =RGBA(107, 125, 132, 1)
            DisplayMode: =DisplayMode.Disabled
            Fill: =RGBA(233, 239, 241, 1)
            Height: =110
            Size: =12
            Text: ="Quality Order" & Char(10) & "later release"
            Width: =(Parent.Width - 44) / 2
            X: =16
            Y: =If(varQueued > 0, 266, 226)
      - HM_Tile_NC:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(210, 220, 223, 1)
            Color: =RGBA(13, 98, 115, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Height: =110
            OnSelect: =Navigate(QMCreateNC, ScreenTransition.None)
            Size: =12
            Text: ="Create NC" & Char(10) & "internal, customer, vendor"
            Width: =(Parent.Width - 44) / 2
            X: =Parent.Width / 2 + 6
            Y: =If(varQueued > 0, 266, 226)
      - HM_DeferredNote:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(107, 125, 132, 1)
            Height: =32
            Size: =9
            Text: ="Quality order creation is planned for a later release."
            Width: =Parent.Width - 32
            X: =16
            Y: =If(varQueued > 0, 386, 346)
