Screens:
  QMAttachments:
    Properties:
      Fill: =RGBA(244, 246, 247, 1)
      LoadingSpinnerColor: =RGBA(13, 98, 115, 1)
      OnVisible: |
        =Set(varAtTestId, "");
         Set(varAtTestSeq, 0);
         Set(varPhoto, Blank());
         Set(varB64, "");
         Refresh('Attachments (draft)')
    Children:
      - AT_HeaderBar:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(13, 98, 115, 1)
            FontWeight: =FontWeight.Semibold
            Height: =56
            PaddingLeft: =56
            Size: =18
            Text: |
              =If(IsBlank(varOrder.cog_qualityordernumber),
                  "Photos  -  no order selected",
                  "Photos  -  QO " & varOrder.cog_qualityordernumber)
            Width: =Parent.Width
      - AT_BackButton:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(255, 255, 255, 1)
            BorderThickness: =1
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(13, 98, 115, 1)
            Height: =32
            OnSelect: =Back()
            Size: =12
            Text: ="<"
            Width: =40
            X: =8
            Y: =12
      - AT_SyncStrip:
          Control: Label@2.5.1
          Properties:
            Color: =If(Connection.Connected, RGBA(32, 97, 61, 1), RGBA(138, 86, 6, 1))
            Fill: =If(Connection.Connected, RGBA(222, 238, 228, 1), RGBA(248, 235, 214, 1))
            FontWeight: =FontWeight.Semibold
            Height: =28
            PaddingLeft: =16
            Size: =9
            Text: |
              =If(Connection.Connected,
                  "Online  -  the photo reaches F&O within about 15 seconds",
                  "Offline  -  the photo is held in the queue and sent when you reconnect")
            Width: =Parent.Width
            Y: =56
      - AT_L1:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(107, 125, 132, 1)
            FontWeight: =FontWeight.Semibold
            Height: =20
            Size: =8
            Text: ="1   WHAT IS THE PHOTO OF"
            Width: =660
            X: =16
            Y: =96
      - AT_WholeOrderButton:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =If(IsBlank(varAtTestId), RGBA(13, 98, 115, 1), RGBA(210, 220, 223, 1))
            Color: =If(IsBlank(varAtTestId), RGBA(255, 255, 255, 1), RGBA(13, 98, 115, 1))
            DisplayMode: =DisplayMode.Disabled
            Fill: =If(IsBlank(varAtTestId), RGBA(13, 98, 115, 1), RGBA(255, 255, 255, 1))
            Height: =36
            OnSelect: |
              =Set(varAtTestId, "");
               Set(varAtTestSeq, 0)
            Size: =11
            Text: ="Pick a test below - F&O cannot attach to the order as a whole"
            Width: =660
            X: =16
            Y: =120
      - AT_TestGallery:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Height: =200
            Items: |
              =SortByColumns(
                 Filter('Quality Test Lines (cache)',
                        cog_qualityordernumber = varOrder.cog_qualityordernumber,
                        cog_company = varOrder.cog_company),
                 "cog_testsequence", SortOrder.Ascending)
            OnSelect: |
              =Set(varAtTestId, ThisItem.cog_testid);
               Set(varAtTestSeq, ThisItem.cog_testsequence)
            TemplatePadding: =0
            TemplateSize: =44
            Width: =660
            X: =16
            Y: =164
          Children:
            - AT_TestRowFill:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: |
                    =If(ThisItem.cog_testsequence = varAtTestSeq && !IsBlank(varAtTestId),
                        RGBA(222, 238, 228, 1), RGBA(255, 255, 255, 1))
                  Height: =43
                  OnSelect: =Select(Parent)
                  Width: =Parent.TemplateWidth
            - AT_TestName:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(13, 98, 115, 1)
                  FontWeight: =FontWeight.Semibold
                  Height: =36
                  OnSelect: |
                    =Set(varAtTestId, ThisItem.cog_testid);
                     Set(varAtTestSeq, ThisItem.cog_testsequence)
                  Size: =11
                  Text: =ThisItem.cog_testid
                  Underline: =true
                  Width: =Parent.TemplateWidth - 120
                  X: =12
                  Y: =4
            - AT_TestSeq:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  Color: =RGBA(107, 125, 132, 1)
                  Height: =36
                  OnSelect: |
                    =Set(varAtTestId, ThisItem.cog_testid);
                     Set(varAtTestSeq, ThisItem.cog_testsequence)
                  Size: =9
                  Text: ="seq " & ThisItem.cog_testsequence
                  Width: =96
                  X: =Parent.TemplateWidth - 108
                  Y: =4
            - AT_TestRule:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(210, 220, 223, 1)
                  Height: =1
                  Width: =Parent.TemplateWidth
                  Y: =43
      - AT_L2:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(107, 125, 132, 1)
            FontWeight: =FontWeight.Semibold
            Height: =20
            Size: =8
            Text: ="PHOTOS FOR THIS ORDER"
            Width: =660
            X: =16
            Y: =372
      - AT_ListGallery:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Height: =340
            Items: |
              =SortByColumns(
                 Filter('Attachments (draft)',
                        cog_qualityordernumber = varOrder.cog_qualityordernumber,
                        cog_company = varOrder.cog_company),
                 "cog_capturedon", SortOrder.Descending)
            TemplatePadding: =0
            TemplateSize: =72
            Width: =660
            X: =16
            Y: =396
          Children:
            - AT_ListRowFill:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =71
                  OnSelect: =Select(Parent)
                  Width: =Parent.TemplateWidth
            - AT_Thumb:
                Control: Image@2.2.3
                Properties:
                  Height: =59
                  Image: |
                    =If(StartsWith(ThisItem.cog_base64, "data:"),
                        ThisItem.cog_base64,
                        "data:image/jpeg;base64," & ThisItem.cog_base64)
                  Visible: =!IsBlank(ThisItem.cog_base64)
                  Width: =84
                  X: =8
                  Y: =6
            - AT_ListName:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(16, 26, 30, 1)
                  FontWeight: =FontWeight.Semibold
                  Height: =22
                  Size: =11
                  Text: =ThisItem.cog_filename
                  Width: =Parent.TemplateWidth - 220
                  X: =100
                  Y: =8
            - AT_ListMeta:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(107, 125, 132, 1)
                  Height: =20
                  Size: =9
                  Text: |
                    =If(IsBlank(ThisItem.cog_testid), "whole order",
                        ThisItem.cog_testid & "  -  seq " & ThisItem.cog_testsequence) &
                     "   -   " & Text(RoundDown(ThisItem.cog_sizechars / 1024, 0), "0") & " KB" &
                     "   -   " & Text(ThisItem.cog_capturedon, "dd mmm hh:mm")
                  Width: =Parent.TemplateWidth - 220
                  X: =100
                  Y: =32
            - AT_ListStatus:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: |
                    =Switch(ThisItem.cog_attachstatus,
                        4, RGBA(32, 97, 61, 1),
                        5, RGBA(156, 31, 23, 1),
                        RGBA(138, 86, 6, 1))
                  Fill: |
                    =Switch(ThisItem.cog_attachstatus,
                        4, RGBA(222, 238, 228, 1),
                        5, RGBA(247, 227, 225, 1),
                        RGBA(248, 235, 214, 1))
                  FontWeight: =FontWeight.Semibold
                  Height: =28
                  Size: =9
                  Text: |
                    =Switch(ThisItem.cog_attachstatus,
                        1, "DRAFT",
                        2, "QUEUED",
                        3, "SENDING",
                        4, "ACCEPTED",
                        5, "ATTENTION", "-")
                  Width: =104
                  X: =Parent.TemplateWidth - 112
                  Y: =22
            - AT_ListRule:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(210, 220, 223, 1)
                  Height: =1
                  Width: =Parent.TemplateWidth
                  Y: =71
      - AT_R1:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(107, 125, 132, 1)
            FontWeight: =FontWeight.Semibold
            Height: =20
            Size: =8
            Text: ="2   TAKE THE PHOTO"
            Width: =650
            X: =700
            Y: =96
      - AT_AddMedia:
          Control: AddMedia@2.2.1
          Properties:
            Height: =240
            OnChange: |
              =Set(varPhoto, AT_AddMedia.Media);
               Set(varB64, Substitute(JSON(AT_Preview.Image, JSONFormat.IncludeBinaryData), """", ""))
            Size: =13
            Width: =320
            X: =700
            Y: =118
      - AT_PreviewFrame:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(233, 239, 241, 1)
            Height: =240
            Width: =320
            X: =1030
            Y: =118
      - AT_PreviewHint:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(107, 125, 132, 1)
            Height: =240
            Size: =9
            Text: ="The captured photo appears here"
            Visible: =IsBlank(varB64)
            Width: =320
            X: =1030
            Y: =118
      - AT_Preview:
          Control: Image@2.2.3
          Properties:
            Height: =240
            Image: =AT_AddMedia.Media
            Width: =320
            X: =1030
            Y: =118
      - AT_CaptureButton:
          Control: Classic/Button@2.2.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(13, 98, 115, 1)
            Height: =36
            OnSelect: |
              =Set(varPhoto, AT_AddMedia.Media);
               Set(varB64, Substitute(JSON(AT_Preview.Image, JSONFormat.IncludeBinaryData), """", ""))
            Size: =12
            Text: ="Use this photo"
            Width: =320
            X: =700
            Y: =364
      - AT_ClearButton:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(210, 220, 223, 1)
            Color: =RGBA(13, 98, 115, 1)
            DisplayMode: =If(IsBlank(varB64), DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =RGBA(255, 255, 255, 1)
            Height: =36
            OnSelect: |
              =Set(varPhoto, Blank());
               Set(varB64, "");
               Reset(AT_AddMedia)
            Size: =12
            Text: ="Discard"
            Width: =320
            X: =1030
            Y: =364
      - AT_R2:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(107, 125, 132, 1)
            FontWeight: =FontWeight.Semibold
            Height: =20
            Size: =8
            Text: ="3   NAME AND ATTACH"
            Width: =650
            X: =700
            Y: =410
      - AT_FileName:
          Control: Classic/TextInput@2.3.2
          Properties:
            Default: |
              ="QO" & varOrder.cog_qualityordernumber & "-" & Text(Now(), "hhmmss") & ".jpg"
            Height: =36
            HintText: ="file name"
            Size: =11
            Width: =650
            X: =700
            Y: =434
      - AT_SizeNote:
          Control: Label@2.5.1
          Properties:
            Color: |
              =If(IsBlank(varB64), RGBA(107, 125, 132, 1),
                  Len(varB64) > 1048576, RGBA(156, 31, 23, 1),
                  RGBA(32, 97, 61, 1))
            Fill: |
              =If(IsBlank(varB64), RGBA(233, 239, 241, 1),
                  Len(varB64) > 1048576, RGBA(247, 227, 225, 1),
                  RGBA(222, 238, 228, 1))
            FontWeight: =FontWeight.Semibold
            Height: =44
            PaddingLeft: =12
            PaddingRight: =12
            Size: =10
            Text: |
              =If(IsBlank(varB64),
                  "No photo chosen yet. Tap Add picture above.",
                  !StartsWith(varB64, "data:"),
                    "Photo not readable yet - tap Use this photo.",
                  Len(varB64) > 1048576,
                    "Too large: " & Text(RoundDown(Len(varB64) / 1024, 0), "0") &
                    " KB of base64. F&O accepts 1024 KB and rejects anything larger, so this " &
                    "cannot be queued. Retake it further back or at a lower camera resolution.",
                  "Ready: " & Text(RoundDown(Len(varB64) / 1024, 0), "0") &
                  " KB of base64, inside the 1024 KB F&O limit.  Subject: " &
                  If(IsBlank(varAtTestId), "no test selected yet", varAtTestId))
            Width: =650
            X: =700
            Y: =478
      - AT_AttachButton:
          Control: Classic/Button@2.2.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            DisplayMode: |
              =If(!IsBlank(varB64) &&
                  Len(varB64) <= 1048576 &&
                  !IsBlank(AT_FileName.Text) &&
                  !IsBlank(varOrder.cog_qualityordernumber) &&
                  !IsBlank(varAtTestId) &&
                  StartsWith(varB64, "data:"),
                  DisplayMode.Edit, DisplayMode.Disabled)
            Fill: =RGBA(13, 98, 115, 1)
            Height: =44
            OnSelect: |
              =Set(varAtCorrelationId, Text(GUID()));
               Patch('Attachments (draft)', Defaults('Attachments (draft)'),
                 { cog_name: varOrder.cog_qualityordernumber & " | " &
                             If(IsBlank(varAtTestId), "order", varAtTestId) & " | " & AT_FileName.Text,
                   cog_qualityordernumber: varOrder.cog_qualityordernumber,
                   cog_company: varOrder.cog_company,
                   cog_testid: varAtTestId,
                   cog_testsequence: varAtTestSeq,
                   cog_linenum: 0,
                   cog_filename: AT_FileName.Text,
                   cog_base64: varB64,
                   cog_sizechars: Len(varB64),
                   cog_correlationid: varAtCorrelationId,
                   cog_attachstatus: 2,
                   cog_capturedon: Now() });
               Patch(Outbox, Defaults(Outbox),
                 { cog_name: "PostAttachment " & varOrder.cog_qualityordernumber & " " & AT_FileName.Text,
                   cog_operationtype: 3,
                   cog_correlationid: varAtCorrelationId,
                   cog_company: varOrder.cog_company,
                   cog_outboxstatus: 2,
                   cog_attempts: 0,
                   cog_queuedon: Now(),
                   cog_payload:
                     "{""Operation"":""PostAttachment"",""CorrelationId"":""" & varAtCorrelationId &
                     """,""Company"":""" & varOrder.cog_company & """}" });
               Notify("Photo queued for QO " & varOrder.cog_qualityordernumber, NotificationType.Success);
               Set(varPhoto, Blank());
               Set(varB64, "");
               Reset(AT_FileName);
               Refresh('Attachments (draft)')
            Size: =13
            Text: ="Attach to the quality order"
            Width: =650
            X: =700
            Y: =530
      - AT_HowNote:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(107, 125, 132, 1)
            Fill: =RGBA(233, 239, 241, 1)
            Height: =100
            PaddingLeft: =12
            PaddingRight: =12
            Size: =8
            Text: |
              ="ACCEPTED means F&O has taken the file. F&O then attaches it on its next processing " &
               "run, which measured about 13 to 14 minutes, so allow roughly 15 minutes before " &
               "looking for it on the quality order in F&O. A photo that fails turns ATTENTION and " &
               "can be retried from the Submission Queue under the same correlation id, so a photo " &
               "that did land is never attached twice."
            Width: =650
            X: =700
            Y: =584
      - AT_NoOrder:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(138, 86, 6, 1)
            Fill: =RGBA(248, 235, 214, 1)
            FontWeight: =FontWeight.Semibold
            Height: =60
            PaddingLeft: =12
            PaddingRight: =12
            Size: =10
            Text: |
              ="No quality order is selected. Go back to Enter Test Results, open an order, then " &
               "choose Photos."
            Visible: =IsBlank(varOrder.cog_qualityordernumber)
            Width: =650
            X: =700
            Y: =96
