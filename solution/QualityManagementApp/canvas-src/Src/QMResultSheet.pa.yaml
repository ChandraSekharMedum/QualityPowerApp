Screens:
  QMResultSheet:
    Properties:
      Fill: =RGBA(244, 246, 247, 1)
      LoadingSpinnerColor: =RGBA(13, 98, 115, 1)
      OnVisible: |
        =Refresh('Quality Test Lines (cache)');
         Clear(colOutcome)
    Children:
      - RS_HeaderBar:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(13, 98, 115, 1)
            FontWeight: =FontWeight.Semibold
            Height: =56
            PaddingLeft: =56
            Size: =18
            Text: |
              =If(IsBlank(varOrder.cog_qualityordernumber),
                  "No order selected",
                  "QO " & varOrder.cog_qualityordernumber)
            Width: =Parent.Width
      - RS_BackButton:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(255, 255, 255, 1)
            BorderThickness: =1
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(13, 98, 115, 1)
            Height: =32
            OnSelect: =Back()
            Size: =12
            Text: ="<"
            Width: =40
            X: =8
            Y: =12
      - RS_PhotosButton:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(255, 255, 255, 1)
            BorderThickness: =1
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(13, 98, 115, 1)
            Height: =32
            OnSelect: =Navigate(QMAttachments, ScreenTransition.None)
            Size: =11
            Text: |
              ="Photos" &
               With({ n: CountRows(Filter('Attachments (draft)',
                          cog_qualityordernumber = varOrder.cog_qualityordernumber,
                          cog_company = varOrder.cog_company)) },
                  If(n > 0, "  (" & n & ")", ""))
            Width: =120
            X: =Parent.Width - 136
            Y: =12
      - RS_Context:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(16, 26, 30, 1)
            FontWeight: =FontWeight.Semibold
            Height: =22
            Size: =10
            Text: |
              =varOrder.cog_itemnumber & "  -  " & varOrder.cog_productname &
               If(IsBlank(varOrder.cog_batchnumber), "", "  -  " & varOrder.cog_batchnumber)
            Width: =Parent.Width - 32
            X: =16
            Y: =66
      - RS_Chips:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(107, 125, 132, 1)
            Height: =20
            Size: =9
            Text: |
              ="Qty " & varOrder.cog_inventoryquantity &
               "   -   Group " & varOrder.cog_testgroupid &
               "   -   Site " & varOrder.cog_siteid
            Width: =Parent.Width - 32
            X: =16
            Y: =88
      - RS_GridHeader:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(107, 125, 132, 1)
            Fill: =RGBA(233, 239, 241, 1)
            FontWeight: =FontWeight.Semibold
            Height: =26
            PaddingLeft: =10
            Size: =8
            Text: ="TEST  /  TOLERANCE"
            Width: =Parent.Width - 32
            X: =16
            Y: =116
      - RS_TestGallery:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Height: =Parent.Height - 236
            Items: |
              =SortByColumns(
                 Filter('Quality Test Lines (cache)',
                        'Quality order number' = varOrder.'Quality order number',
                        Company = varOrder.Company),
                 "cog_testsequence", SortOrder.Ascending)
            TemplatePadding: =0
            TemplateSize: =72
            Width: =Parent.Width - 32
            X: =16
            Y: =142
          Children:
            - RS_RowFill:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =71
                  OnSelect: =Select(Parent)
                  Width: =Parent.TemplateWidth
            - RS_TestName:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(16, 26, 30, 1)
                  FontWeight: =FontWeight.Semibold
                  Height: =22
                  Size: =12
                  Text: =ThisItem.Test
                  Width: |
                    =If(IsBlank(ThisItem.'Outcome variable'),
                        Parent.TemplateWidth - 200, Parent.TemplateWidth - 336)
                  X: =10
                  Y: =8
            - RS_Tolerance:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(107, 125, 132, 1)
                  Height: =20
                  Size: =9
                  Text: |
                    =If(!IsBlank(ThisItem.'Outcome variable'),
                        "Choose an outcome  -  " & ThisItem.'Outcome variable',
                        ThisItem.'Upper limit' > ThisItem.'Lower limit',
                        "Range " & ThisItem.'Lower limit' & " - " & ThisItem.'Upper limit' &
                          If(IsBlank(ThisItem.Unit), "", " " & ThisItem.Unit),
                        "No numeric range") &
                     If(IsBlank(ThisItem.Instrument), "",
                        "  -  " & ThisItem.Instrument)
                  Width: |
                    =If(IsBlank(ThisItem.'Outcome variable'),
                        Parent.TemplateWidth - 200, Parent.TemplateWidth - 336)
                  X: =10
                  Y: =30
            - RS_EnteredValue:
                Control: Classic/TextInput@2.3.2
                Properties:
                  Align: =Align.Right
                  Default: =""
                  HintText: ="value"
                  Visible: =IsBlank(ThisItem.'Outcome variable')
                  Width: =96
                  X: =Parent.TemplateWidth - 186
                  Y: =16
            - RS_Outcome1:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(210, 220, 223, 1)
                  Color: |
                    =If(LookUp(colOutcome, Seq = ThisItem.Sequence).Outcome =
                          Index(SortByColumns(Filter('Test Outcomes (cache)',
                             'Outcome variable' = ThisItem.'Outcome variable',
                             Company = varOrder.Company), "cog_outcomeid"), 1).cog_outcomeid,
                        RGBA(255, 255, 255, 1), RGBA(13, 98, 115, 1))
                  Fill: |
                    =If(LookUp(colOutcome, Seq = ThisItem.Sequence).Outcome =
                          Index(SortByColumns(Filter('Test Outcomes (cache)',
                             'Outcome variable' = ThisItem.'Outcome variable',
                             Company = varOrder.Company), "cog_outcomeid"), 1).cog_outcomeid,
                        RGBA(13, 98, 115, 1), RGBA(255, 255, 255, 1))
                  OnSelect: |
                    =With({ o: Index(SortByColumns(Filter('Test Outcomes (cache)',
                                 'Outcome variable' = ThisItem.'Outcome variable',
                                 Company = varOrder.Company), "cog_outcomeid"), 1) },
                        RemoveIf(colOutcome, Seq = ThisItem.Sequence);
                        Collect(colOutcome,
                          { Seq: ThisItem.Sequence,
                            Outcome: o.cog_outcomeid,
                            Implied: o.'Implied result' }))
                  Size: =9
                  Text: |
                    =Index(SortByColumns(Filter('Test Outcomes (cache)',
                             'Outcome variable' = ThisItem.'Outcome variable',
                             Company = varOrder.Company), "cog_outcomeid"), 1).cog_outcomeid
                  Visible: =!IsBlank(ThisItem.'Outcome variable')
                  Width: =76
                  X: =Parent.TemplateWidth - 326
                  Y: =16
            - RS_Outcome2:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(210, 220, 223, 1)
                  Color: |
                    =If(LookUp(colOutcome, Seq = ThisItem.Sequence).Outcome =
                          Index(SortByColumns(Filter('Test Outcomes (cache)',
                             'Outcome variable' = ThisItem.'Outcome variable',
                             Company = varOrder.Company), "cog_outcomeid"), 2).cog_outcomeid,
                        RGBA(255, 255, 255, 1), RGBA(13, 98, 115, 1))
                  Fill: |
                    =If(LookUp(colOutcome, Seq = ThisItem.Sequence).Outcome =
                          Index(SortByColumns(Filter('Test Outcomes (cache)',
                             'Outcome variable' = ThisItem.'Outcome variable',
                             Company = varOrder.Company), "cog_outcomeid"), 2).cog_outcomeid,
                        RGBA(13, 98, 115, 1), RGBA(255, 255, 255, 1))
                  OnSelect: |
                    =With({ o: Index(SortByColumns(Filter('Test Outcomes (cache)',
                                 'Outcome variable' = ThisItem.'Outcome variable',
                                 Company = varOrder.Company), "cog_outcomeid"), 2) },
                        RemoveIf(colOutcome, Seq = ThisItem.Sequence);
                        Collect(colOutcome,
                          { Seq: ThisItem.Sequence,
                            Outcome: o.cog_outcomeid,
                            Implied: o.'Implied result' }))
                  Size: =9
                  Text: |
                    =Index(SortByColumns(Filter('Test Outcomes (cache)',
                             'Outcome variable' = ThisItem.'Outcome variable',
                             Company = varOrder.Company), "cog_outcomeid"), 2).cog_outcomeid
                  Visible: |
                    =!IsBlank(ThisItem.'Outcome variable') &&
                     CountRows(Filter('Test Outcomes (cache)',
                       'Outcome variable' = ThisItem.'Outcome variable',
                       Company = varOrder.Company)) >= 2
                  Width: =76
                  X: =Parent.TemplateWidth - 246
                  Y: =16
            - RS_Outcome3:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(210, 220, 223, 1)
                  Color: |
                    =If(LookUp(colOutcome, Seq = ThisItem.Sequence).Outcome =
                          Index(SortByColumns(Filter('Test Outcomes (cache)',
                             'Outcome variable' = ThisItem.'Outcome variable',
                             Company = varOrder.Company), "cog_outcomeid"), 3).cog_outcomeid,
                        RGBA(255, 255, 255, 1), RGBA(13, 98, 115, 1))
                  Fill: |
                    =If(LookUp(colOutcome, Seq = ThisItem.Sequence).Outcome =
                          Index(SortByColumns(Filter('Test Outcomes (cache)',
                             'Outcome variable' = ThisItem.'Outcome variable',
                             Company = varOrder.Company), "cog_outcomeid"), 3).cog_outcomeid,
                        RGBA(13, 98, 115, 1), RGBA(255, 255, 255, 1))
                  OnSelect: |
                    =With({ o: Index(SortByColumns(Filter('Test Outcomes (cache)',
                                 'Outcome variable' = ThisItem.'Outcome variable',
                                 Company = varOrder.Company), "cog_outcomeid"), 3) },
                        RemoveIf(colOutcome, Seq = ThisItem.Sequence);
                        Collect(colOutcome,
                          { Seq: ThisItem.Sequence,
                            Outcome: o.cog_outcomeid,
                            Implied: o.'Implied result' }))
                  Size: =9
                  Text: |
                    =Index(SortByColumns(Filter('Test Outcomes (cache)',
                             'Outcome variable' = ThisItem.'Outcome variable',
                             Company = varOrder.Company), "cog_outcomeid"), 3).cog_outcomeid
                  Visible: |
                    =!IsBlank(ThisItem.'Outcome variable') &&
                     CountRows(Filter('Test Outcomes (cache)',
                       'Outcome variable' = ThisItem.'Outcome variable',
                       Company = varOrder.Company)) >= 3
                  Width: =76
                  X: =Parent.TemplateWidth - 166
                  Y: =16
            - RS_Verdict:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: |
                    =If(!IsBlank(ThisItem.'Outcome variable'),
                          If(IsBlank(LookUp(colOutcome, Seq = ThisItem.Sequence).Outcome),
                               RGBA(107, 125, 132, 1),
                             LookUp(colOutcome, Seq = ThisItem.Sequence).Implied = 200000001,
                               RGBA(32, 97, 61, 1),
                             RGBA(156, 31, 23, 1)),
                        IsBlank(RS_EnteredValue.Text), RGBA(107, 125, 132, 1),
                        ThisItem.'Upper limit' <= ThisItem.'Lower limit', RGBA(107, 125, 132, 1),
                        Value(RS_EnteredValue.Text) < ThisItem.'Lower limit' ||
                        Value(RS_EnteredValue.Text) > ThisItem.'Upper limit',
                          RGBA(156, 31, 23, 1),
                        RGBA(32, 97, 61, 1))
                  Fill: |
                    =If(!IsBlank(ThisItem.'Outcome variable'),
                          If(IsBlank(LookUp(colOutcome, Seq = ThisItem.Sequence).Outcome),
                               RGBA(233, 239, 241, 1),
                             LookUp(colOutcome, Seq = ThisItem.Sequence).Implied = 200000001,
                               RGBA(222, 238, 228, 1),
                             RGBA(247, 227, 225, 1)),
                        IsBlank(RS_EnteredValue.Text), RGBA(233, 239, 241, 1),
                        ThisItem.'Upper limit' <= ThisItem.'Lower limit', RGBA(233, 239, 241, 1),
                        Value(RS_EnteredValue.Text) < ThisItem.'Lower limit' ||
                        Value(RS_EnteredValue.Text) > ThisItem.'Upper limit',
                          RGBA(247, 227, 225, 1),
                        RGBA(222, 238, 228, 1))
                  FontWeight: =FontWeight.Semibold
                  Size: =10
                  Text: |
                    =If(!IsBlank(ThisItem.'Outcome variable'),
                          If(IsBlank(LookUp(colOutcome, Seq = ThisItem.Sequence).Outcome), "-",
                             LookUp(colOutcome, Seq = ThisItem.Sequence).Implied = 200000001,
                               "PASS", "FAIL"),
                        IsBlank(RS_EnteredValue.Text), "-",
                        ThisItem.'Upper limit' > ThisItem.'Lower limit',
                          If(Value(RS_EnteredValue.Text) >= ThisItem.'Lower limit' &&
                             Value(RS_EnteredValue.Text) <= ThisItem.'Upper limit',
                             "PASS", "FAIL"),
                        "-")
                  Width: =72
                  X: =Parent.TemplateWidth - 82
                  Y: =16
            - RS_RowRule:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(210, 220, 223, 1)
                  Height: =1
                  Width: =Parent.TemplateWidth
                  Y: =71
      - RS_Summary:
          Control: Label@2.5.1
          Properties:
            Color: |
              =If(CountRows(Filter(RS_TestGallery.AllItems, RS_Verdict.Text = "FAIL")) > 0,
                  RGBA(156, 31, 23, 1), RGBA(16, 26, 30, 1))
            Fill: |
              =If(CountRows(Filter(RS_TestGallery.AllItems, RS_Verdict.Text = "FAIL")) > 0,
                  RGBA(247, 227, 225, 1), RGBA(233, 239, 241, 1))
            FontWeight: =FontWeight.Semibold
            Height: =32
            PaddingLeft: =10
            Size: =10
            Text: |
              =With({ e: CountRows(Filter(RS_TestGallery.AllItems, !IsBlank(RS_EnteredValue.Text) || !IsBlank(LookUp(colOutcome, Seq = Sequence).Outcome))),
                      f: CountRows(Filter(RS_TestGallery.AllItems, RS_Verdict.Text = "FAIL")),
                      t: CountRows(RS_TestGallery.AllItems) },
                 If(e = 0, "No results entered  " & t & " tests",
                    "Order verdict: " & If(f > 0, "Fail", "Pass") &
                    "  -  " & e & " of " & t & " entered" &
                    If(f > 0, "  -  " & f & " failing", "")))
            Width: =Parent.Width - 32
            X: =16
            Y: =Parent.Height - 88
      - RS_SubmitButton:
          Control: Classic/Button@2.2.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            DisplayMode: |
              =If(CountRows(Filter(RS_TestGallery.AllItems, !IsBlank(RS_EnteredValue.Text) || !IsBlank(LookUp(colOutcome, Seq = Sequence).Outcome))) = 0,
                  DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =RGBA(13, 98, 115, 1)
            OnSelect: |
              =Set(varCorrelationId, Text(GUID()));
               Set(varEntered, Filter(RS_TestGallery.AllItems, !IsBlank(RS_EnteredValue.Text) || !IsBlank(LookUp(colOutcome, Seq = Sequence).Outcome)));
               Set(varFailCount, CountRows(Filter(RS_TestGallery.AllItems, RS_Verdict.Text = "FAIL")));
               Set(varSheet,
                 Patch('Result Sheets (draft)', Defaults('Result Sheets (draft)'),
                   { 'Result sheet': varOrder.'Quality order number' & " (draft)",
                     'Quality order number': varOrder.'Quality order number',
                     Company: varOrder.Company,
                     'Sheet status': 2,
                     'Correlation id': varCorrelationId,
                     'Computed verdict': If(varFailCount > 0, 200000000, 200000001),
                     'Started on': Now(),
                     'Completed on': Now() }));
               ForAll(varEntered As L,
                 Patch('Result Entries (draft)', Defaults('Result Entries (draft)'),
                   { 'Result entry': varOrder.'Quality order number' & " | " & L.Sequence & " | " & L.Test,
                     Test: L.Test,
                     Sequence: L.Sequence,
                     'Entered value':
                       If(IsBlank(LookUp(colOutcome, Seq = L.Sequence).Outcome),
                          L.RS_EnteredValue.Text,
                          LookUp(colOutcome, Seq = L.Sequence).Outcome),
                     'Computed verdict': If(L.RS_Verdict.Text = "FAIL", 200000000, 200000001),
                     'Entered on': Now(),
                     'Result sheet': varSheet }));
               Patch(Outbox, Defaults(Outbox),
                 { 'Outbox item': "PostTestResults " & varOrder.'Quality order number',
                   'Operation type': 1,
                   'Correlation id': varCorrelationId,
                   Company: varOrder.Company,
                   'Status (cog_outboxstatus)': 2,
                   Attempts: 0,
                   'Queued on': Now(),
                   'Result sheet': varSheet,
                   Payload:
                     "{""Operation"":""PostTestResults"",""CorrelationId"":""" & varCorrelationId &
                     """,""Company"":""" & varOrder.Company &
                     """,""TargetEntity"":""mserp_inventqualityorderlineresultentities"",""Lines"":[" &
                     Concat(varEntered As L2,
                       "{""TargetRecordId"":""" & L2.'F&O result line id' &
                       """,""QualityOrderNumber"":""" & varOrder.'Quality order number' &
                       """,""TestId"":""" & L2.Test &
                       """,""TestSequence"":" & L2.Sequence &
                       ",""ResultValue"":" & Coalesce(Value(L2.RS_EnteredValue.Text), 0) &
                       ",""OutcomeId"":""" & LookUp(colOutcome, Seq = L2.Sequence).Outcome & """" &
                       ",""TestResult"":" & If(L2.RS_Verdict.Text = "FAIL", 200000000, 200000001) & "}",
                       ",") &
                     "]}" });
               Notify("Submitted  " & CountRows(varEntered) & " result(s) queued", NotificationType.Success);
               Navigate(QMQueue, ScreenTransition.None)
            Size: =13
            Text: ="Save & submit"
            Width: =Parent.Width - 32
            X: =16
            Y: =Parent.Height - 48
