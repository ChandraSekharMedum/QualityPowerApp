# ************************************************************************************************
# Quality Management -- Submission queue
#
# Shows the outbox: what is waiting, what F&O accepted, and what needs attention. This is the
# screen that makes the offline design legible to an inspector -- without it, a submission
# made in a dead spot just disappears.
#
# Status values are the cog_outboxstatus convention from phase2/scripts/schema.ps1:
#   1 Draft  2 Queued  3 Submitting  4 Confirmed  5 Needs attention  6 Duplicate (skipped)
# ************************************************************************************************
Screens:
  QMQueue:
    Properties:
      Fill: =RGBA(244, 246, 247, 1)
      LoadingSpinnerColor: =RGBA(13, 98, 115, 1)
    Children:
      - QQ_HeaderBar:
          Control: Label
          Properties:
            Text: ="Submission Queue"
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =56
            Fill: =RGBA(13, 98, 115, 1)
            Color: =RGBA(255, 255, 255, 1)
            Size: =18
            FontWeight: =FontWeight.Semibold
            PaddingLeft: =56
            VerticalAlign: =VerticalAlign.Middle

      - QQ_BackButton:
          Control: Classic/Button
          Properties:
            Text: ="<"
            X: =8
            Y: =12
            Width: =40
            Height: =32
            Fill: =RGBA(13, 98, 115, 1)
            Color: =RGBA(255, 255, 255, 1)
            BorderColor: =RGBA(255, 255, 255, 1)
            BorderThickness: =1
            Size: =12
            OnSelect: =Back()

      - QQ_RefreshButton:
          Control: Classic/Button
          Properties:
            Text: ="Refresh"
            X: =Parent.Width - 96
            Y: =12
            Width: =88
            Height: =32
            Fill: =RGBA(13, 98, 115, 1)
            Color: =RGBA(255, 255, 255, 1)
            BorderColor: =RGBA(255, 255, 255, 1)
            BorderThickness: =1
            Size: =10
            OnSelect: =Refresh(Outbox)

      - QQ_Summary:
          Control: Label
          Properties:
            Text: |
              =CountRows(Filter(Outbox, cog_outboxstatus = 2)) & " queued   -   " &
               CountRows(Filter(Outbox, cog_outboxstatus = 3)) & " submitting   -   " &
               CountRows(Filter(Outbox, cog_outboxstatus = 4)) & " confirmed   -   " &
               CountRows(Filter(Outbox, cog_outboxstatus = 5)) & " need attention   -   " &
               CountRows(Filter(Outbox, cog_outboxstatus = 6)) & " duplicate"
            X: =16
            Y: =70
            Width: =Parent.Width - 32
            Height: =32
            Fill: =RGBA(233, 239, 241, 1)
            Color: =RGBA(16, 26, 30, 1)
            Size: =9
            FontWeight: =FontWeight.Semibold
            PaddingLeft: =10
            VerticalAlign: =VerticalAlign.Middle

      - QQ_Gallery:
          Control: Gallery
          Variant: Vertical
          Properties:
            Items: =SortByColumns(Outbox, "cog_queuedon", SortOrder.Descending)
            X: =16
            Y: =112
            Width: =Parent.Width - 32
            Height: =Parent.Height - 128
            TemplateSize: =84
            TemplatePadding: =0
            ShowScrollbar: =true
          Children:
            - QQ_RowFill:
                Control: Rectangle
                Properties:
                  X: =0
                  Y: =0
                  Width: =Parent.TemplateWidth
                  Height: =83
                  Fill: =RGBA(255, 255, 255, 1)

            - QQ_Name:
                Control: Label
                Properties:
                  Text: =ThisItem.cog_name
                  X: =12
                  Y: =10
                  Width: =Parent.TemplateWidth - 130
                  Height: =22
                  Size: =12
                  FontWeight: =FontWeight.Semibold
                  Color: =RGBA(16, 26, 30, 1)

            - QQ_Meta:
                Control: Label
                Properties:
                  Text: |
                    =Text(ThisItem.cog_queuedon, "dd mmm hh:mm") &
                     "  -  " & ThisItem.cog_company &
                     If(ThisItem.cog_attempts > 0, "  -  attempt " & ThisItem.cog_attempts, "")
                  X: =12
                  Y: =34
                  Width: =Parent.TemplateWidth - 130
                  Height: =20
                  Size: =9
                  Color: =RGBA(107, 125, 132, 1)

            - QQ_Error:
                Control: Label
                Properties:
                  Text: =If(IsBlank(ThisItem.cog_lasterror), "", Left(ThisItem.cog_lasterror, 90))
                  Visible: =ThisItem.cog_outboxstatus = 5 || ThisItem.cog_outboxstatus = 6
                  X: =12
                  Y: =54
                  Width: =Parent.TemplateWidth - 24
                  Height: =20
                  Size: =8
                  Color: =RGBA(156, 31, 23, 1)

            - QQ_Status:
                Control: Label
                Properties:
                  Text: |
                    =Switch(ThisItem.cog_outboxstatus,
                        1, "DRAFT",
                        2, "QUEUED",
                        3, "SENDING",
                        4, "CONFIRMED",
                        5, "ATTENTION",
                        6, "DUPLICATE", "-")
                  X: =Parent.TemplateWidth - 116
                  Y: =20
                  Width: =104
                  Height: =28
                  Size: =9
                  FontWeight: =FontWeight.Semibold
                  Align: =Align.Center
                  VerticalAlign: =VerticalAlign.Middle
                  Color: |
                    =Switch(ThisItem.cog_outboxstatus,
                        4, RGBA(32, 97, 61, 1),
                        5, RGBA(156, 31, 23, 1),
                        6, RGBA(107, 125, 132, 1),
                        RGBA(138, 86, 6, 1))
                  Fill: |
                    =Switch(ThisItem.cog_outboxstatus,
                        4, RGBA(222, 238, 228, 1),
                        5, RGBA(247, 227, 225, 1),
                        6, RGBA(233, 239, 241, 1),
                        RGBA(248, 235, 214, 1))

            - QQ_Retry:
                Control: Classic/Button
                Properties:
                  Text: ="Retry"
                  Visible: =ThisItem.cog_outboxstatus = 5
                  X: =Parent.TemplateWidth - 116
                  Y: =50
                  Width: =104
                  Height: =26
                  Size: =9
                  Fill: =RGBA(156, 31, 23, 1)
                  Color: =RGBA(255, 255, 255, 1)
                  # Retry CREATES a new outbox row rather than re-queuing this one. The drain
                  # flow triggers on create only, and an append-only queue keeps every attempt
                  # as its own auditable record.
                  #
                  # The original correlation id is carried over deliberately: if the first
                  # attempt actually reached F&O, the duplicate check rejects this one instead
                  # of writing twice.
                  OnSelect: |
                    =Patch(Outbox, Defaults(Outbox),
                       { cog_name: ThisItem.cog_name,
                         cog_operationtype: ThisItem.cog_operationtype,
                         cog_correlationid: ThisItem.cog_correlationid,
                         cog_company: ThisItem.cog_company,
                         cog_payload: ThisItem.cog_payload,
                         cog_outboxstatus: 2,
                         cog_attempts: 0,
                         cog_queuedon: Now() });
                     Patch(Outbox, ThisItem, { cog_lasterror: "Superseded by a retry" });
                     Notify("Retry queued", NotificationType.Information);
                     Refresh(Outbox)

            - QQ_RowRule:
                Control: Rectangle
                Properties:
                  X: =0
                  Y: =83
                  Width: =Parent.TemplateWidth
                  Height: =1
                  Fill: =RGBA(210, 220, 223, 1)

