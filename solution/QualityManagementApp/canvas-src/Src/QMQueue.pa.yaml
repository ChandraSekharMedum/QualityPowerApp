Screens:
  QMQueue:
    Properties:
      Fill: =RGBA(244, 246, 247, 1)
      LoadingSpinnerColor: =RGBA(13, 98, 115, 1)
    Children:
      - QQ_HeaderBar:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(13, 98, 115, 1)
            FontWeight: =FontWeight.Semibold
            Height: =56
            PaddingLeft: =56
            Size: =18
            Text: ="Submission Queue"
            Width: =Parent.Width
      - QQ_BackButton:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(255, 255, 255, 1)
            BorderThickness: =1
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(13, 98, 115, 1)
            Height: =32
            OnSelect: =Back()
            Size: =12
            Text: ="<"
            Width: =40
            X: =8
            Y: =12
      - QQ_RefreshButton:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(255, 255, 255, 1)
            BorderThickness: =1
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(13, 98, 115, 1)
            Height: =32
            OnSelect: =Refresh(Outbox)
            Size: =10
            Text: ="Refresh"
            Width: =88
            X: =Parent.Width - 96
            Y: =12
      - QQ_Summary:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(16, 26, 30, 1)
            Fill: =RGBA(233, 239, 241, 1)
            FontWeight: =FontWeight.Semibold
            Height: =32
            PaddingLeft: =10
            Size: =9
            Text: |
              =CountRows(Filter(Outbox, cog_outboxstatus = 2)) & " queued   -   " &
               CountRows(Filter(Outbox, cog_outboxstatus = 3)) & " submitting   -   " &
               CountRows(Filter(Outbox, cog_outboxstatus = 4)) & " confirmed   -   " &
               CountRows(Filter(Outbox, cog_outboxstatus = 5)) & " need attention   -   " &
               CountRows(Filter(Outbox, cog_outboxstatus = 6)) & " duplicate"
            Width: =Parent.Width - 32
            X: =16
            Y: =70
      - QQ_Gallery:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Height: =Parent.Height - 128
            Items: =SortByColumns(Outbox, "cog_queuedon", SortOrder.Descending)
            TemplatePadding: =0
            TemplateSize: =84
            Width: =Parent.Width - 32
            X: =16
            Y: =112
          Children:
            - QQ_RowFill:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =83
                  OnSelect: =Select(Parent)
                  Width: =Parent.TemplateWidth
            - QQ_Name:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(16, 26, 30, 1)
                  FontWeight: =FontWeight.Semibold
                  Height: =22
                  Size: =12
                  Text: =ThisItem.cog_name
                  Width: =Parent.TemplateWidth - 130
                  X: =12
                  Y: =10
            - QQ_Meta:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(107, 125, 132, 1)
                  Height: =20
                  Size: =9
                  Text: |
                    =Text(ThisItem.cog_queuedon, "dd mmm hh:mm") &
                     "  -  " & ThisItem.cog_company &
                     If(ThisItem.cog_attempts > 0, "  -  attempt " & ThisItem.cog_attempts, "")
                  Width: =Parent.TemplateWidth - 130
                  X: =12
                  Y: =34
            - QQ_Error:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(156, 31, 23, 1)
                  Height: =20
                  Size: =8
                  Text: =If(IsBlank(ThisItem.cog_lasterror), "", Left(ThisItem.cog_lasterror, 90))
                  Visible: =ThisItem.cog_outboxstatus = 5 || ThisItem.cog_outboxstatus = 6
                  Width: =Parent.TemplateWidth - 24
                  X: =12
                  Y: =54
            - QQ_Status:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: |
                    =Switch(ThisItem.cog_outboxstatus,
                        4, RGBA(32, 97, 61, 1),
                        5, RGBA(156, 31, 23, 1),
                        6, RGBA(107, 125, 132, 1),
                        RGBA(138, 86, 6, 1))
                  Fill: |
                    =Switch(ThisItem.cog_outboxstatus,
                        4, RGBA(222, 238, 228, 1),
                        5, RGBA(247, 227, 225, 1),
                        6, RGBA(233, 239, 241, 1),
                        RGBA(248, 235, 214, 1))
                  FontWeight: =FontWeight.Semibold
                  Height: =28
                  Size: =9
                  Text: |
                    =Switch(ThisItem.cog_outboxstatus,
                        1, "DRAFT",
                        2, "QUEUED",
                        3, "SENDING",
                        4, "CONFIRMED",
                        5, "ATTENTION",
                        6, "DUPLICATE", "-")
                  Width: =104
                  X: =Parent.TemplateWidth - 116
                  Y: =20
            - QQ_Retry:
                Control: Classic/Button@2.2.0
                Properties:
                  Color: =RGBA(255, 255, 255, 1)
                  Fill: =RGBA(156, 31, 23, 1)
                  Height: =26
                  OnSelect: |
                    =Patch(Outbox, Defaults(Outbox),
                       { cog_name: ThisItem.cog_name,
                         cog_operationtype: ThisItem.cog_operationtype,
                         cog_correlationid: ThisItem.cog_correlationid,
                         cog_company: ThisItem.cog_company,
                         cog_payload: ThisItem.cog_payload,
                         cog_outboxstatus: 2,
                         cog_attempts: 0,
                         cog_queuedon: Now() });
                     Patch(Outbox, ThisItem, { cog_lasterror: "Superseded by a retry" });
                     Notify("Retry queued", NotificationType.Information);
                     Refresh(Outbox)
                  Size: =9
                  Text: ="Retry"
                  Visible: =ThisItem.cog_outboxstatus = 5
                  Width: =104
                  X: =Parent.TemplateWidth - 116
                  Y: =50
            - QQ_RowRule:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(210, 220, 223, 1)
                  Height: =1
                  Width: =Parent.TemplateWidth
                  Y: =83
