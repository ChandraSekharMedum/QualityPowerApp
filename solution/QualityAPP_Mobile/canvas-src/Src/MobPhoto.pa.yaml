# ************************************************************************************************
# Quality App Mobile -- photograph a defect.  Phone layout, 640 x 1136 portrait.
#
# Writes straight to POWERAPPFILESAVINGENTITY. The write itself takes about a second.
#
# A probe row was observed disappearing from the staging entity after about 13.5 minutes, which
# was initially read as "F&O attaches it on a periodic job". That was wrong: the disappearance is
# the staging row being cleaned up, which is not the same event as the attachment being created.
# The demo app in usdemo01 uses this same entity and its attachments appear immediately, so F&O
# creates the attachment on insert.
#
# TWO DETAILS COPIED FROM THE WORKING DEMO APP IN usdemo01, both re-probed here:
#   ImageVarchar keeps the whole "data:image/jpeg;base64,..." string; only the quotes JSON() adds
#   are stripped. F&O accepts raw base64 too, but rendering cannot be verified over OData, so the
#   proven form wins.
#   TableRefId is the literal "0000". The field is required but evidently only needs a value.
#
# F&O accepts exactly 1,048,576 characters and rejects one more, so the size is checked here
# rather than letting F&O reject it minutes later.
# ************************************************************************************************
Screens:
  MobPhoto:
    Properties:
      Fill: =RGBA(244, 246, 247, 1)
      LoadingSpinnerColor: =RGBA(13, 98, 115, 1)
      OnVisible: |
        =Set(varPhoto, Blank());
         Set(varB64, "")
    Children:
      - MP_HeaderBar:
          Control: Label
          Properties:
            Text: |
              =If(IsBlank(varQO.mserp_qualityordernumber),
                  "Photo  -  no order",
                  "Photo  -  QO " & varQO.mserp_qualityordernumber)
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =56
            Fill: =RGBA(13, 98, 115, 1)
            Color: =RGBA(255, 255, 255, 1)
            Size: =17
            FontWeight: =FontWeight.Semibold
            PaddingLeft: =56
            VerticalAlign: =VerticalAlign.Middle

      - MP_BackButton:
          Control: Classic/Button
          Properties:
            Text: ="<"
            X: =8
            Y: =12
            Width: =40
            Height: =32
            Fill: =RGBA(13, 98, 115, 1)
            Color: =RGBA(255, 255, 255, 1)
            BorderColor: =RGBA(255, 255, 255, 1)
            BorderThickness: =1
            Size: =12
            OnSelect: =Back()

      # The "This test" / "Whole order" toggle is gone. F&O's quality attachment path identifies a
      # test line, so a whole-order photo had nowhere to bind -- offering the choice implied a
      # capability that does not exist.
      - MP_Subject:
          Control: Label
          Properties:
            Text: |
              =If(varLineSelected,
                  "Attaching to: " & Trim(varLineTest) & "  (seq " & varLineSeq & ")",
                  "Go back and tap a test first - F&O attaches the photo to a test line.")
            X: =12
            Y: =116
            Width: =Parent.Width - 24
            Height: =22
            Size: =10
            Color: =RGBA(107, 125, 132, 1)

      # The live Camera control did not work on the device. The demo app in usdemo01 uses the
      # ADD PICTURE control instead -- 'AddMediaButton1 As addMedia' in its source -- and that is
      # confirmed working, so this mirrors it. On a phone it opens the device camera or gallery,
      # which also sidesteps camera permissions in the browser.
      #
      # Named without a Classic/ prefix on the same reasoning as Camera: the prefix appears where
      # a modern counterpart exists (Button, TextInput, CheckBox), and Add picture has none.
      - MP_AddMedia:
          Control: AddMedia
          Properties:
            X: =12
            Y: =144
            Width: =Parent.Width - 24
            Height: =330
            Size: =15
            # ENCODE THE IMAGE CONTROL, NOT THE MEDIA. JSON(MP_AddMedia.Media, IncludeBinaryData)
            # returns a blob REFERENCE (appres://blobmanager/...), roughly 40 characters, which F&O
            # rejects with "The string is not a valid base 64 encoded string" -- and the size
            # readout showed 0 KB, which is the tell. Routing the media through an Image control
            # first is what makes IncludeBinaryData actually inline the bytes. The demo app does
            # exactly this: PreviewImage.Image = AddMediaButton1.Media, then JSON(PreviewImage.Image).
            OnChange: |
              =Set(varPhoto, MP_AddMedia.Media);
               Set(varB64, Substitute(JSON(MP_Preview.Image, JSONFormat.IncludeBinaryData), """", ""))

      - MP_UseButton:
          Control: Classic/Button
          Properties:
            Text: ="Use this photo"
            X: =12
            Y: =484
            Width: =(Parent.Width - 36) / 2
            Height: =52
            Fill: =RGBA(13, 98, 115, 1)
            Color: =RGBA(255, 255, 255, 1)
            Size: =14
            FontWeight: =FontWeight.Semibold
            # Belt and braces if OnChange does not fire. Encodes the Image control, as above.
            OnSelect: |
              =Set(varPhoto, MP_AddMedia.Media);
               Set(varB64, Substitute(JSON(MP_Preview.Image, JSONFormat.IncludeBinaryData), """", ""))

      - MP_DiscardButton:
          Control: Classic/Button
          Properties:
            Text: ="Discard"
            X: =Parent.Width / 2 + 6
            Y: =484
            Width: =(Parent.Width - 36) / 2
            Height: =52
            Fill: =RGBA(255, 255, 255, 1)
            Color: =RGBA(13, 98, 115, 1)
            BorderColor: =RGBA(210, 220, 223, 1)
            BorderThickness: =2
            Size: =14
            DisplayMode: =If(IsBlank(varB64), DisplayMode.Disabled, DisplayMode.Edit)
            OnSelect: |
              =Set(varPhoto, Blank());
               Set(varB64, "");
               Reset(MP_AddMedia)

      - MP_PreviewFrame:
          Control: Rectangle
          Properties:
            X: =12
            Y: =548
            Width: =Parent.Width - 24
            Height: =300
            Fill: =RGBA(233, 239, 241, 1)

      - MP_PreviewHint:
          Control: Label
          Properties:
            Text: ="The photo you pick appears here"
            Visible: =IsBlank(varB64)
            X: =12
            Y: =548
            Width: =Parent.Width - 24
            Height: =300
            Size: =11
            Align: =Align.Center
            VerticalAlign: =VerticalAlign.Middle
            Color: =RGBA(107, 125, 132, 1)

      - MP_Preview:
          Control: Image
          Properties:
            # Always visible, and bound straight to the control. This is not just a preview: it is
            # the thing that gets encoded, so it must be live before varB64 is computed. Gating it
            # on varB64 would be circular. With no media it paints nothing and the hint shows.
            Image: =MP_AddMedia.Media
            Visible: =true
            X: =12
            Y: =548
            Width: =Parent.Width - 24
            Height: =300
            ImagePosition: =ImagePosition.Fit

      - MP_FileName:
          Control: Classic/TextInput
          Properties:
            Default: |
              ="QO" & varQO.mserp_qualityordernumber & "-" & Text(Now(), "hhmmss") & ".jpg"
            HintText: ="file name"
            X: =12
            Y: =860
            Width: =Parent.Width - 24
            Height: =44
            Size: =12

      - MP_SizeNote:
          Control: Label
          Properties:
            # The StartsWith check catches a blob reference being mistaken for image data. Without
            # it the screen cheerfully reported "Ready: 0 KB" and F&O rejected the send.
            Text: |
              =If(IsBlank(varB64),
                  "No photo chosen yet. Tap Add picture above.",
                  !StartsWith(varB64, "data:"),
                    "Photo not readable yet - tap Use this photo.",
                  Len(varB64) > 1048576,
                    "Too large: " & Text(RoundDown(Len(varB64) / 1024, 0), "0") &
                    " KB. F&O accepts 1024 KB. Pick a smaller photo.",
                  "Ready: " & Text(RoundDown(Len(varB64) / 1024, 0), "0") &
                  " KB, inside the 1024 KB F&O limit.")
            X: =12
            Y: =912
            Width: =Parent.Width - 24
            Height: =52
            Size: =11
            FontWeight: =FontWeight.Semibold
            PaddingLeft: =12
            PaddingRight: =12
            VerticalAlign: =VerticalAlign.Middle
            Color: |
              =If(IsBlank(varB64), RGBA(107, 125, 132, 1),
                  !StartsWith(varB64, "data:"), RGBA(138, 86, 6, 1),
                  Len(varB64) > 1048576, RGBA(156, 31, 23, 1),
                  RGBA(32, 97, 61, 1))
            Fill: |
              =If(IsBlank(varB64), RGBA(233, 239, 241, 1),
                  !StartsWith(varB64, "data:"), RGBA(248, 235, 214, 1),
                  Len(varB64) > 1048576, RGBA(247, 227, 225, 1),
                  RGBA(222, 238, 228, 1))

      - MP_AttachButton:
          Control: Classic/Button
          Properties:
            # A disabled button that says "Send to F&O" just looks broken -- the user clicks and
            # nothing happens. Say why instead.
            Text: |
              =If(varSending, "Sending...",
                  !varLineSelected, "Pick a test first - go back",
                  IsBlank(varB64), "Add a picture first",
                  "Send to F&O")
            X: =12
            Y: =974
            Width: =Parent.Width - 24
            Height: =56
            Fill: =RGBA(13, 98, 115, 1)
            Color: =RGBA(255, 255, 255, 1)
            Size: =15
            FontWeight: =FontWeight.Semibold
            DisplayMode: |
              =If(varSending ||
                  IsBlank(varB64) ||
                  !StartsWith(varB64, "data:") ||
                  Len(varB64) > 1048576 ||
                  IsBlank(MP_FileName.Text) ||
                  IsBlank(varQO.mserp_qualityordernumber) ||
                  !varLineSelected,
                  DisplayMode.Disabled, DisplayMode.Edit)
            # LineNum is looked up rather than carried in a variable, so the result row stays the
            # single source of truth for it. mserp_formname caps at 20 characters.
            OnSelect: |
              =Set(varSending, true);
               Patch('PowerAppFileSavingEntity (mserp)', Defaults('PowerAppFileSavingEntity (mserp)'),
                 { mserp_tablerefid: "0000",
                   mserp_displayordernumber: varQO.mserp_qualityordernumber,
                   # Always sent. The demo app's quality path has no whole-order option -- it
                   # always identifies a test line, so that is the shape F&O is known to accept.
                   mserp_testid: varLineTest,
                   mserp_testsequence: varLineSeq,
                   mserp_linenum:
                     Coalesce(
                       LookUp('Quality order line results (mserp)',
                              mserp_qualityordernumber = varQO.mserp_qualityordernumber &&
                              mserp_dataareaid = varQO.mserp_dataareaid &&
                              mserp_qualityordersequencenumber = varLineSeq).mserp_resultlinenumber,
                       0),
                   mserp_filename: MP_FileName.Text,
                   # "Quality", NOT "InventQualityOrder". FormName tells F&O which context the
                   # file belongs to. With the wrong value F&O accepted the row, consumed it, and
                   # bound the file to nothing -- the upload looked successful and no attachment
                   # ever appeared. The demo app sends "Quality" on the quality path and
                   # "Non conformance" on the NC path.
                   mserp_formname: "Quality",
                   mserp_imagevarchar: varB64,
                   mserp_dataareaid: varQO.mserp_dataareaid });
               Set(varSending, false);
               If(IsEmpty(Errors('PowerAppFileSavingEntity (mserp)')),
                  Notify("Photo sent to F&O.", NotificationType.Success);
                  Set(varPhoto, Blank());
                  Set(varB64, "");
                  Reset(MP_FileName),
                  Notify(First(Errors('PowerAppFileSavingEntity (mserp)')).Message,
                         NotificationType.Error))

      - MP_HowNote:
          Control: Label
          Properties:
            Text: |
              ="A photo must belong to a test line. F&O processes those within seconds; one sent " &
               "without a test line is never picked up at all. Proven by probe, 2026-08-18."
            X: =12
            Y: =1038
            Width: =Parent.Width - 24
            Height: =56
            Fill: =RGBA(233, 239, 241, 1)
            Color: =RGBA(107, 125, 132, 1)
            Size: =9
            PaddingLeft: =12
            PaddingRight: =12
            VerticalAlign: =VerticalAlign.Middle
