# ************************************************************************************************
# Quality App Mobile -- order picker.  Phone layout, 640 x 1136 portrait.
#
# Rationale lives in docs\MOBILE-ONLINE-DESIGN.md; Export-Solution.ps1 strips comments from here.
#
# ONLINE ONLY. This app reads and writes F&O virtual tables directly -- no cache, no outbox, no
# flows. The offline tablet app (QualityManagementApp) is untouched and keeps its own design.
#
# Every row label carries its own OnSelect. A label swallows the tap, so a gallery whose rows are
# covered by labels never fires the gallery's own OnSelect. That cost us a broken screen once.
# ************************************************************************************************
Screens:
  MobOrders:
    Properties:
      Fill: =RGBA(244, 246, 247, 1)
      LoadingSpinnerColor: =RGBA(13, 98, 115, 1)
      OnVisible: =Refresh('Quality orders (mserp)')
    Children:
      - MO_HeaderBar:
          Control: Label
          Properties:
            Text: ="Quality Orders"
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =56
            Fill: =RGBA(13, 98, 115, 1)
            Color: =RGBA(255, 255, 255, 1)
            Size: =17
            FontWeight: =FontWeight.Semibold
            PaddingLeft: =16
            VerticalAlign: =VerticalAlign.Middle

      - MO_Search:
          Control: Classic/TextInput
          Properties:
            Default: =""
            HintText: ="search order or item"
            X: =12
            Y: =66
            Width: =Parent.Width - 24
            Height: =44
            Size: =13

      - MO_OpenOnly:
          Control: Classic/CheckBox
          Properties:
            Text: ="Open only"
            X: =12
            Y: =118
            Width: =240
            Height: =32
            Size: =12
            Color: =RGBA(16, 26, 30, 1)

      - MO_Count:
          Control: Label
          Properties:
            Text: =CountRows(MO_Gallery.AllItems) & " shown"
            X: =Parent.Width - 172
            Y: =118
            Width: =160
            Height: =32
            Size: =10
            Align: =Align.Right
            VerticalAlign: =VerticalAlign.Middle
            Color: =RGBA(107, 125, 132, 1)

      - MO_Gallery:
          Control: Gallery
          Variant: Vertical
          Properties:
            # Status 200000000 Open, 200000001 Fail, 200000002 Pass.
            Items: |
              =SortByColumns(
                 Filter('Quality orders (mserp)',
                        (!MO_OpenOnly.Value || mserp_qualityorderstatus = 200000000),
                        (IsBlank(MO_Search.Text) ||
                         StartsWith(mserp_qualityordernumber, MO_Search.Text) ||
                         StartsWith(mserp_itemnumber, MO_Search.Text))),
                 "mserp_qualityordernumber", SortOrder.Descending)
            X: =12
            Y: =158
            Width: =Parent.Width - 24
            Height: =Parent.Height - 170
            TemplateSize: =92
            TemplatePadding: =0
            ShowScrollbar: =true
            OnSelect: |
              =Set(varQO, ThisItem);
               Navigate(MobResults, ScreenTransition.None)
          Children:
            - MO_RowFill:
                Control: Rectangle
                Properties:
                  X: =0
                  Y: =0
                  Width: =Parent.TemplateWidth
                  Height: =91
                  Fill: =RGBA(255, 255, 255, 1)
                  # A Rectangle swallows the tap exactly like a Label does. Without this handler
                  # the bare parts of the row -- the gaps between labels, under the status chip --
                  # are dead, and the gallery's own OnSelect never fires. On a phone people tap
                  # the row, not the text, so this is the handler that actually gets used.
                  OnSelect: |
                    =Set(varQO, ThisItem);
                     Navigate(MobResults, ScreenTransition.None)

            - MO_OrderNo:
                Control: Label
                Properties:
                  Text: ="QO " & ThisItem.mserp_qualityordernumber
                  X: =12
                  Y: =8
                  Width: =Parent.TemplateWidth - 132
                  Height: =26
                  Size: =14
                  FontWeight: =FontWeight.Semibold
                  Underline: =true
                  Color: =RGBA(13, 98, 115, 1)
                  VerticalAlign: =VerticalAlign.Middle
                  OnSelect: |
                    =Set(varQO, ThisItem);
                     Navigate(MobResults, ScreenTransition.None)

            - MO_Status:
                Control: Label
                Properties:
                  # A Dataverse CHOICE column does not compare to a number client-side, so the old
                  # Switch on 200000000 returned blank -- blank text on a blank fill is what
                  # rendered as a solid black chip. The *name companion columns exist in metadata
                  # but F&O leaves them empty, so they are no help. Text() coerces a choice to its
                  # label; the numeric branches stay as a fallback in case it yields the raw value.
                  Text: |
                    =Switch(Text(ThisItem.mserp_qualityorderstatus),
                        "Open", "OPEN", "200000000", "OPEN",
                        "Fail", "FAIL", "200000001", "FAIL",
                        "Pass", "PASS", "200000002", "PASS", "-")
                  X: =Parent.TemplateWidth - 116
                  Y: =8
                  Width: =104
                  Height: =26
                  Size: =10
                  FontWeight: =FontWeight.Semibold
                  Align: =Align.Center
                  VerticalAlign: =VerticalAlign.Middle
                  Color: |
                    =Switch(Text(ThisItem.mserp_qualityorderstatus),
                        "Fail", RGBA(156, 31, 23, 1), "200000001", RGBA(156, 31, 23, 1),
                        "Pass", RGBA(32, 97, 61, 1), "200000002", RGBA(32, 97, 61, 1),
                        RGBA(138, 86, 6, 1))
                  Fill: |
                    =Switch(Text(ThisItem.mserp_qualityorderstatus),
                        "Fail", RGBA(247, 227, 225, 1), "200000001", RGBA(247, 227, 225, 1),
                        "Pass", RGBA(222, 238, 228, 1), "200000002", RGBA(222, 238, 228, 1),
                        RGBA(248, 235, 214, 1))
                  OnSelect: |
                    =Set(varQO, ThisItem);
                     Navigate(MobResults, ScreenTransition.None)

            - MO_Item:
                Control: Label
                Properties:
                  Text: |
                    =Trim(ThisItem.mserp_itemnumber) &
                     If(IsBlank(ThisItem.mserp_productname), "", "  -  " & ThisItem.mserp_productname)
                  X: =12
                  Y: =36
                  Width: =Parent.TemplateWidth - 24
                  Height: =24
                  Size: =12
                  Color: =RGBA(16, 26, 30, 1)
                  VerticalAlign: =VerticalAlign.Middle
                  OnSelect: |
                    =Set(varQO, ThisItem);
                     Navigate(MobResults, ScreenTransition.None)

            - MO_Meta:
                Control: Label
                Properties:
                  Text: |
                    =Upper(ThisItem.mserp_dataareaid) &
                     "   -   group " & Trim(ThisItem.mserp_qualitytestgroupid) &
                     "   -   qty " & ThisItem.mserp_inventoryquantity
                  X: =12
                  Y: =60
                  Width: =Parent.TemplateWidth - 24
                  Height: =22
                  Size: =10
                  Color: =RGBA(107, 125, 132, 1)
                  VerticalAlign: =VerticalAlign.Middle
                  OnSelect: |
                    =Set(varQO, ThisItem);
                     Navigate(MobResults, ScreenTransition.None)

            - MO_Rule:
                Control: Rectangle
                Properties:
                  X: =0
                  Y: =91
                  Width: =Parent.TemplateWidth
                  Height: =1
                  Fill: =RGBA(210, 220, 223, 1)
